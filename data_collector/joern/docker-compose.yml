services:
  joern:
    image: ghcr.io/joernio/joern:nightly
    container_name: codegraph-joern
    restart: unless-stopped
    command:
      - joern
      - --server
      - --server-host
      - 127.0.0.1
      - --server-port
      - "8080"
      - --server-auth-username
      - ${JOERN_USER}
      - --server-auth-password
      - ${JOERN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./projects:/projects
      - ./exports:/exports:rw
      - joern_workspace:/app/workspace
    working_dir: /app

  neo4j:
    image: neo4j:2026.07.1-community
    container_name: codegraph-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-4G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-2G}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
      - ./exports:/exports:ro

volumes:
  joern_workspace:
